apiVersion: apps/v1
kind: Deployment
metadata:
  name: sclab-gis-process
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sclab-gis-process
  template:
    metadata:
      labels:
        app: sclab-gis-process
    spec:
      containers:
        - name: sclab-gis-process
          image: 873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio/onpremise-gis-process:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 250m
            limits:
              cpu: 1000m
          envFrom:
            - configMapRef:
                name: sclab-common-env
          env:
            # Rust gis-process downloads uploaded files from this internal webapp URL.
            - name: ROOT_URL
              value: http://sclab-webapp-service
            - name: SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
      imagePullSecrets:
        - name: sclab-ecr-sec