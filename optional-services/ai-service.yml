# Optional service 'ai-service'. Managed by ./service-manage.sh (and install.sh): inserted into / removed from docker-compose.yml.
# Keep the two-space indentation: it is inserted under "services:".
  ai-service:
    container_name: ai-service
    hostname: ai-service
    image: "873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio/onpremise-ai-service:latest"
    restart: always
    ports:
      - "80"
    volumes:
      - ./data/ai-service/logs:/data/logs
      - ./jwt:/data/jwt
    env_file:
      - ./common.env
      - ./ai-service.env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      - mongo
      - redis
      - qdrant
      - webapp
      - node-vm-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sclab-network
