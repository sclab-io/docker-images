# Optional service 'gis-process'. Managed by ./service-manage.sh (and install.sh): inserted into / removed from docker-compose.yml.
# Keep the two-space indentation: it is inserted under "services:".
  gis-process:
    container_name: gis-process
    hostname: gis-process
    image: "873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio/onpremise-gis-process:latest"
    restart: always
    env_file:
      - ./common.env
      - ./gis-process.env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      - mongo
      - redis
      - webapp
    networks:
      - sclab-network
