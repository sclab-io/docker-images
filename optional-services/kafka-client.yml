# Optional service 'kafka-client'. Managed by ./service-manage.sh (and install.sh): inserted into / removed from docker-compose.yml.
# Keep the two-space indentation: it is inserted under "services:".
  kafka-client:
    container_name: kafka-client
    hostname: kafka-client
    image: "873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio/onpremise-kafka-client:latest"
    restart: always
    env_file:
      - ./common.env
      - ./kafka-client.env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      - mongo
      - redis
      - webapp
    networks:
      - sclab-network
