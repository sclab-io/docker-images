# Optional service 'mail'. Managed by ./service-manage.sh (and install.sh): inserted into / removed from docker-compose.yml.
# Keep the two-space indentation: it is inserted under "services:".
  mail:
    container_name: mail
    hostname: mail
    # Multi-arch (amd64+arm64) SMTP relay. Set MAIL_IMAGE=bytemark/smtp to keep the old amd64-only image.
    image: "${MAIL_IMAGE:-boky/postfix:5.2.1}"
    environment:
      - ALLOW_EMPTY_SENDER_DOMAINS=true
    restart: always
    networks:
      - sclab-network
