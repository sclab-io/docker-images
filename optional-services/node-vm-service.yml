# Optional service 'node-vm-service'. Managed by ./service-manage.sh (and install.sh): inserted into / removed from docker-compose.yml.
# Keep the two-space indentation: it is inserted under "services:".
  node-vm-service:
    container_name: node-vm-service
    hostname: node-vm-service
    image: "873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio/onpremise-node-vm-service:latest"
    restart: always
    volumes:
      - ./data/node-vm-service/logs:/data/logs
    env_file:
      - ./node-vm-service.env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sclab-network
