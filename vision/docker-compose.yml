# SCLAB Vision 배포 스택(기본 aio + console).
#
#   설치: ./install.sh          (단계별 진행, Enter로 기본값 적용)
#   시작: ./up.sh   또는   docker compose up -d
#   중지: ./down.sh
#
# Compose 프로파일은 .env의 COMPOSE_PROFILES로 선택한다:
#   기본        vision-aio + vision-console
#               Mongo/Redis/Qdrant는 sclab-network의 기존 mongo/redis/qdrant를 공유한다
#   profile s3  DVR cold-tier S3 호환 스토리지용 rustfs
#   profile tls 내장 HTTPS 프록시(vision-tls) — 루트 sclab-proxy가 이 호스트에 없을 때
#               8890/8090/8080을 직접 노출한다(sclab-proxy가 있으면 포트 충돌 — 켜지 말 것)
#   GPU         docker-compose.gpu.yml 오버레이가 aio를 aio-gpu로 바꾼다
#
# 네트워크: 외부 sclab-network, 같은 레벨의 메인 스택과 공유한다.
# 볼륨: Vision 소유 데이터는 모두 ./data/vision/* 아래에 bind mount된다.
#
# 프로젝트명은 .env의 COMPOSE_PROJECT_NAME(sclab-vision)으로 지정한다 — 최상위 `name:` 키는
# 구형 docker-compose v1(파이썬판)이 인식하지 못해 스키마 오류를 내므로 쓰지 않는다.

services:
  # 기본 서비스.
  vision-aio:
    container_name: vision-aio
    hostname: vision-aio
    image: "${VISION_REGISTRY:-873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio}/vision-aio:${VISION_TAG:-latest}"
    restart: always
    environment:
      # 환경변수는 DB·Redis 접속값만 — 그 외 모든 설정·시크릿은 MongoDB(콘솔 설정 > 고급 튜닝)에 저장된다.
      # 첫 부팅의 초기값은 ./data/vision/app/runtime-config.seed.json(install.sh가 생성)이 채운다.
      VISION_MONGO_URL: "${VISION_MONGO_URL:-mongodb://root:changeThisMongoPassword@mongo:27017/?authSource=admin}"
      VISION_MONGO_DB: "${VISION_MONGO_DB:-sclab}"
      VISION_REDIS_URL: "${VISION_REDIS_URL:-redis://:changeThisRedisPassword@redis:6379}"
      VISION_STUDIO_SHARED: "${VISION_STUDIO_SHARED:-true}"
      VISION_VERSION: "${VISION_VERSION:-latest}"             # 표시용 빌드 메타데이터(설정 아님)
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - ./data/vision/app:/data
      - ./data/vision/recordings:/var/lib/vision/recordings   # DVR hot segment 저장소
      - ./data/vision/vcam:/tmp/vision-vcam                   # 가상 카메라(vcam) 업로드 변환 스풀(영속)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트의 RTSP source에 접근한다
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "10" }
    networks:
      - sclab-network

  vision-console:
    container_name: vision-console
    hostname: vision-console
    image: "${VISION_REGISTRY:-873379329511.dkr.ecr.ap-northeast-2.amazonaws.com/sclabio}/vision-console:${VISION_TAG:-latest}"
    restart: always
    depends_on:
      - vision-aio
    environment:
      # 설정·시크릿(내부 토큰·관리자 JWT 시크릿·세션 시크릿·OIDC·서비스 주소)은 MongoDB에서 부팅 때 읽는다.
      VISION_MONGO_URL: "${VISION_MONGO_URL:-mongodb://root:changeThisMongoPassword@mongo:27017/?authSource=admin}"
      VISION_MONGO_DB: "${VISION_MONGO_DB:-sclab}"
      VISION_REDIS_URL: "${VISION_REDIS_URL:-redis://:changeThisRedisPassword@redis:6379}"
      VISION_STUDIO_SHARED: "${VISION_STUDIO_SHARED:-true}"
      VISION_VERSION: "${VISION_VERSION:-latest}"
      # 프록시 뒤 오리진 신뢰(SvelteKit CSRF) — 사진/동영상 업로드(multipart POST) 403 방지. (adapter-node 플랫폼 변수)
      PROTOCOL_HEADER: "x-forwarded-proto"
      HOST_HEADER: "x-forwarded-host"
      PORT: "3000"
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "10" }
    networks:
      - sclab-network

  # 내장 HTTPS 프록시(profile: tls) — 루트 sclab-proxy 없이 데이터 서비스만 있는 호스트에서
  # vision을 올릴 때 콘솔/제어/HLS 포트를 직접 노출한다. 인증서는 ./data/vision/certs/
  # (cert.pem/privkey.pem, 없으면 install.sh/up.sh가 자체 서명 생성).
  vision-tls:
    container_name: vision-tls
    hostname: vision-tls
    image: "nginx:alpine3.18"
    restart: always
    profiles: ["tls"]
    depends_on:
      - vision-aio
      - vision-console
    ports:
      - "${VISION_CONSOLE_PORT:-8890}:3000"
      - "${VISION_CONTROL_PORT:-8090}:8090"
      - "${VISION_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./data/vision/certs:/etc/vision-tls:ro
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "10" }
    networks:
      - sclab-network

  # DVR cold-tier 스토리지(profile: s3).
  # RustFS는 S3 호환 object store다. aio는 http://rustfs:9000에 연결한다.
  rustfs:
    container_name: vision-rustfs
    hostname: rustfs
    image: "rustfs/rustfs:latest"
    restart: always
    user: "0:0"
    profiles: ["s3"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${VISION_S3_ACCESS_KEY_ID:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${VISION_S3_SECRET_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - ./data/vision/rustfs:/data
      - ./data/vision/rustfs-logs:/logs
    ports:
      - "${VISION_S3_API_PORT:-19000}:9000"     # 외부 도구와 디버깅용 S3 API
      - "${VISION_S3_CONSOLE_PORT:-19001}:9001"  # RustFS 웹 console
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "10" }
    networks:
      - sclab-network

networks:
  sclab-network:
    external: true
